<div class="dashboard">
  <h1 class="page-title">Dashboard</h1>

  <app-dashboard-filter-bar
    [filter]="filter"
    (filterChange)="onFilterChange($event)"
  ></app-dashboard-filter-bar>

  <div class="kpi-grid">
    <app-dashboard-kpi-card *ngFor="let kpi of kpis" [kpi]="kpi"></app-dashboard-kpi-card>
  </div>

  <div class="mid-grid">
    <app-dashboard-panel title="Kilogramos transportados durante el dia">
      <ul class="product-list">
        <li class="product-row" *ngFor="let p of productWeights">
          <app-product-tag [product]="p.product" [iconKey]="p.iconKey"></app-product-tag>
          <span class="product-kg">{{ p.kg }} kg</span>
        </li>
      </ul>
    </app-dashboard-panel>

    <app-trend-chart [data]="trendData" [range]="trendRange"></app-trend-chart>
  </div>

  <app-dashboard-panel title="Top Proveedores">
    <a panel-action class="link" href="javascript:void(0)" (click)="onProvidersViewAll()">Ver todo</a>
    <table class="data-table">
      <thead>
        <tr>
          <th>Proveedor</th>
          <th>Kilogramos</th>
          <th>Viajes</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of topProviders">
          <td class="strong">{{ row.provider }}</td>
          <td class="muted">{{ row.kg }}</td>
          <td class="muted">{{ row.trips }}</td>
        </tr>
      </tbody>
    </table>
  </app-dashboard-panel>

  <app-dashboard-panel title="Movimientos Recientes">
    <div panel-action class="panel-actions">
      <button class="icon-btn" title="Filtrar" (click)="onMovementsFilter()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/>
        </svg>
      </button>
      <button class="icon-btn" title="Descargar" (click)="onMovementsDownload()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
        </svg>
      </button>
    </div>

    <table class="data-table movements">
      <thead>
        <tr>
          <th>HORA</th>
          <th>PRODUCTO</th>
          <th>KILOGRAMOS</th>
          <th>KILOMETROS</th>
          <th>PROVEEDOR</th>
          <th>DESTINO</th>
          <th>ESTADO</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of recentMovements">
          <td class="muted">{{ m.time }}</td>
          <td><app-product-tag [product]="m.product" [iconKey]="m.iconKey"></app-product-tag></td>
          <td class="strong">{{ m.kg }}</td>
          <td class="muted">{{ m.km }}</td>
          <td>{{ m.provider }}</td>
          <td>{{ m.destination }}</td>
          <td>
            <span class="status-pill" [class.delivered]="m.status === 'delivered'" [class.en-route]="m.status === 'en_route'">
              {{ statusLabel(m.status) }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </app-dashboard-panel>
</div>
