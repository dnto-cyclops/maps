<div class="panel" [class.collapsed]="collapsed">
  <div class="panel-header">
    <div class="content">
      <div class="texts">
        <img src="assets/icons/routes.svg" class="router-icon" />
        <div class="info">
          <div class="title">Rutas</div>
          <div class="subtitle">Monitoreo en tiempo real</div>
        </div>
      </div>
      <button class="collapse-btn" (click)="onTogglePanel()">
        <img [src]="collapsed ? 'assets/icons/open-nav.svg' : 'assets/icons/close-nav.svg'" class="nav-icon" />
      </button>
    </div>

    <div class="panel-summary">
      <div class="summary-item">
        <span class="dot active"></span> {{ activeCount }} <span class="label">Rutas activas</span>
      </div>
      <div class="summary-item">
        <span class="dot paused"></span> {{ pausedCount }} <span class="label">En pausa</span>
      </div>
    </div>
  </div>

  <div class="filters" *ngIf="!collapsed">
    <div class="filter-header">
      <img src="assets/icons/filter.svg" class="filter-icon" /> 
      <span>Filtros</span>
      <button class="toggle-filters-btn" (click)="toggleFiltersVisibility()" [attr.aria-expanded]="showFilters">
        <img [src]="showFilters ? 'assets/icons/chevron-up.svg' : 'assets/icons/chevron-down.svg'" class="chevron-icon" />
      </button>
    </div>

    <div class="filter-controls" *ngIf="showFilters">
      <div class="control-group">
        <label>Estado</label>
        <div class="select-wrapper">
          <select [value]="selectedStatus" (change)="onStatusChange($event)">
            <option *ngFor="let status of uniqueStatusOptions" [value]="status">{{ status }}</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <label>Producto</label>
        <div class="select-wrapper">
          <select [value]="selectedFruit" (change)="onFruitChange($any($event).target.value)">
            <option *ngFor="let fruit of uniqueFruits" [value]="fruit">{{ fruit }}</option>
          </select>
        </div>
      </div>
      <div class="control-group">
        <label>Desde</label>
        <input type="date" class="date-input" [ngModel]="dateFromFilter" 
              (ngModelChange)="setDateFrom($event)" />
      </div>
      <div class="control-group">
        <label>Hasta</label>
        <input type="date" class="date-input" [ngModel]="dateToFilter" 
              (ngModelChange)="setDateTo($event)" />
      </div>
    </div>
  </div>

  <div class="cards-wrapper" *ngIf="!collapsed">
    <div class="cards" #cardsContainer (scroll)="onScroll()">
      <div *ngFor="let route of filteredRoutes" [attr.data-route-id]="route.rId">
        <app-route-card
          [route]="route"
          [selected]="route.rId === selectedRouteId"
          (cardClick)="onRouteSelected($event)">
        </app-route-card>
      </div>
      <div class="empty" *ngIf="filteredRoutes.length === 0">Sin rutas activas</div>
    </div>

    <div class="scroll-controls">
      <button class="scroll-btn" [class.visible]="showScrollUp" (click)="scrollUp()">
        <img src="assets/icons/chevron-up.svg" class="filter-icon" />
      </button>
      <button class="scroll-btn" [class.visible]="showScrollDown" (click)="scrollDown()">
        <img src="assets/icons/chevron-down.svg" class="filter-icon" />
      </button>
    </div>
  </div>
</div>
